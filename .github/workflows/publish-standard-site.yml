name: Publish Standard.site Records

on:
  workflow_dispatch:
  push:
    paths:
      - "content/**/*.md"
  schedule:
    - cron: "17 6 1 */3 *"

permissions:
  contents: write

concurrency:
  group: publish-standard-site
  cancel-in-progress: false

jobs:
  publish-standard-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate Standard.site output
        run: npm run standard:check

      - name: Publish Standard.site documents to ATProto
        if: github.event_name != 'schedule'
        env:
          ATP_IDENTIFIER: jcrt.org
          ATP_APP_PASSWORD: ${{ secrets.ATPROTO_PASSWORD }}
        run: npm run sequoia:publish

      - name: Verify Standard.site output
        run: npm run standard:check && npm run standard:audit

      - name: Commit Standard.site ATProto updates if changed
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- _data/standardSiteRecords.yaml public/.well-known/site.standard.publication .sequoia-state.json content)" ]; then
            echo "No Standard.site ATProto changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/standardSiteRecords.yaml public/.well-known/site.standard.publication content
          if [ -f .sequoia-state.json ]; then
            git add .sequoia-state.json
          fi
          git commit -m "chore: sync Standard.site ATProto records"
          git push
