name: Publish Standard.site Records

# Registers new or edited articles as site.standard.document records on the AT Protocol via
# sequoia-cli, then commits the path → AT-URI map (which _includes/partials/seo.njk renders as
# <link rel="site.standard.document">) and sequoia's state file back to main.
#
# Staged files carry their existing atUri (scripts/sequoia.mjs stage), so an unchanged document
# is a no-op for the CLI and a push that only edits prose produces no bot commit at all.
# A state-only change is committed with [skip netlify]: nothing rendered reads the state file.

on:
  push:
    branches: [main]
    paths:
      - "content/**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-standard-site
  cancel-in-progress: false

jobs:
  publish-standard-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATP_IDENTIFIER: jcrt.org

    steps:
      # ref: main, not the triggering sha: a run queued behind another one must start from the
      # previous run's bot commit, or it re-creates that run's documents and then fails to push.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --no-audit --fund=false

      - name: Validate Standard.site output
        run: npm run standard:check

      # Re-uploads the icon blob and re-puts the publication record. Manual runs only; the
      # record does not change with content.
      - name: Put publication record
        if: github.event_name == 'workflow_dispatch'
        env:
          ATP_APP_PASSWORD: ${{ secrets.ATPROTO_PASSWORD }}
        run: npm run sequoia:publication

      - name: Publish new and changed documents
        env:
          ATP_APP_PASSWORD: ${{ secrets.ATPROTO_PASSWORD }}
        run: npm run sequoia:publish

      - name: Commit record map and state if changed
        run: |
          set -euo pipefail
          paths="_data/standardSiteRecords.yaml .sequoia-state.json"
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "No Standard.site changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $paths
          msg="chore: sync Standard.site ATProto records"
          if git diff --cached --quiet -- _data/standardSiteRecords.yaml; then
            msg="$msg [skip netlify]"
          fi
          git commit -m "$msg"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

      # Newly minted URIs must never be lost silently: if the push failed, keep the files.
      - name: Save state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: standard-site-state
          path: |
            _data/standardSiteRecords.yaml
            .sequoia-state.json
          if-no-files-found: ignore
