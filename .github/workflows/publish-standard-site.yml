name: Publish Standard.site Records

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-standard-site
  cancel-in-progress: false

jobs:
  publish-standard-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Publish Standard.site documents to ATProto
        env:
          ATP_IDENTIFIER: jcrt.org
          ATP_APP_PASSWORD: ${{ secrets.ATPROTO_PASSWORD }}
        run: npm run sequoia:publish

      - name: Verify Standard.site output
        run: npm run standard:check && npm run standard:audit

      - name: Commit Standard.site AT URIs if changed
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- _data/standardSiteRecords.yaml public/.well-known/site.standard.publication .sequoia-state.json)" ]; then
            echo "No Standard.site AT URI changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/standardSiteRecords.yaml public/.well-known/site.standard.publication
          if [ -f .sequoia-state.json ]; then
            git add .sequoia-state.json
          fi
          git commit -m "chore: publish Standard.site AT URIs"
          git push
