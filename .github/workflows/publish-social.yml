name: Publish Social Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8,14,20 * * *"
      timezone: "America/Chicago"

permissions:
  contents: read

concurrency:
  group: publish-social
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Restore publication state
        uses: actions/cache/restore@v4
        with:
          path: .social-publish-state.json
          key: social-publish-${{ github.run_id }}
          restore-keys: social-publish-

      - run: npm ci --no-audit --fund=false

      - name: Publish next item to Mastodon and Bluesky
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          ATPROTO_IDENTIFIER: ${{ secrets.ATPROTO_IDENTIFIER }}
          ATPROTO_PASSWORD: ${{ secrets.ATPROTO_PASSWORD }}
        run: node scripts/publish-social.mjs

      - name: Save publication state
        if: always() && hashFiles('.social-publish-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .social-publish-state.json
          key: social-publish-${{ github.run_id }}
