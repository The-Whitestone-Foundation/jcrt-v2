name: Dispatch Citation Regeneration

# Citation files (.ris / .csl.json) live in jcrt-files and are built from the
# markdown in this repo. jcrt-files can only regenerate them on demand, so a
# push that adds or edits an article has to tell it to run — otherwise the new
# article's citation URLs 404 until someone triggers the workflow by hand.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'content/archives/**'
      - 'content/religioustheory/posts/**'
      - '_data/legacy-ris-dates.json'

concurrency:
  group: dispatch-citations
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Generate Citations in jcrt-files
        env:
          GH_TOKEN: ${{ secrets.JCRT_FILES_PUSH_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository_owner }}/jcrt-files/dispatches" \
            -f event_type=generate-citations
