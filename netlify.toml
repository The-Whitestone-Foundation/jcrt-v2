[build]
  command = "npm run build:netlify"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--prefer-offline"
  NPM_CONFIG_CACHE = ".npm-cache"
  ELEVENTY_ENV = "production"
  SITE_URL = "https://jcrt.org"

[build.processing]
  skip_processing = true

[[redirects]]
  from = "http://jcrt.org/oai"
  to = "https://jcrt.org/oai"
  status = 302
  force = true

[[redirects]]
  from = "http://jcrt.org/sitemaps/oai_dc.xml"
  to = "https://jcrt.org/sitemaps/oai_dc.xml"
  status = 302
  force = true

[[redirects]]
  from = "http://jcrt.org/sitemap/oai_dc.xml"
  to = "https://jcrt.org/sitemap/oai_dc.xml"
  status = 302
  force = true

[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".cache", ".npm-cache"]

[[edge_functions]]
  function = "allow-indexing-bots"
  path = "/*"
  # Static assets never need this function. Without the exclusion these three /*
  # functions all execute on every CSS, JS, image and Pagefind request, stacking three
  # edge invocations in front of files that could otherwise be served straight from CDN.
  excludedPath = ["/css/*", "/js/*", "/fonts/*", "/badges/*", "/pagefind/*", "/images/*", "/favicon.ico"]

[[edge_functions]]
  function = "oai-pmh"
  path = "/sitemaps/oai_dc.xml"

[[edge_functions]]
  function = "oai-pmh"
  path = "/sitemap/oai_dc.xml"

[[edge_functions]]
  function = "oai-pmh"
  path = "/oai"

[[edge_functions]]
  function = "query-canonical-redirects"
  path = "/*"
  # Static assets never need this function. Without the exclusion these three /*
  # functions all execute on every CSS, JS, image and Pagefind request, stacking three
  # edge invocations in front of files that could otherwise be served straight from CDN.
  excludedPath = ["/css/*", "/js/*", "/fonts/*", "/badges/*", "/pagefind/*", "/images/*", "/favicon.ico"]

[[edge_functions]]
  function = "archive-legacy-redirects"
  path = "/archives/*"

[[edge_functions]]
  function = "asset-canonical-redirects"
  path = "/citations/*"

[[edge_functions]]
  function = "asset-canonical-redirects"
  path = "/images"

[[edge_functions]]
  function = "asset-canonical-redirects"
  path = "/images/*"

[[edge_functions]]
  function = "asset-canonical-redirects"
  path = "/docs/*"

[[edge_functions]]
  function = "markdown-for-agents"
  path = "/*"
  # Static assets never need this function. Without the exclusion these three /*
  # functions all execute on every CSS, JS, image and Pagefind request, stacking three
  # edge invocations in front of files that could otherwise be served straight from CDN.
  excludedPath = ["/css/*", "/js/*", "/fonts/*", "/badges/*", "/pagefind/*", "/images/*", "/favicon.ico"]

# Cache-Control and CORS for static assets live in `public/_headers` (single source of
# truth). Defining them here too produced two conflicting rules for /css/*, /js/* and
# /images/* with undefined precedence.
