[build]
  command = "npm run build:netlify"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--prefer-offline"
  ELEVENTY_ENV = "production"
  SITE_URL = "https://jcrt.org"

# The IndexNow key is public by protocol (it is served at /<key>.txt from public/); it lives
# here so plugins/indexnow can be exercised locally with the same value.
[context.production.environment]
  INDEXNOW_KEY = "c1cf137ca1024d45a2c0308f2468052e"

[build.processing]
  skip_processing = true

# /Copyright/ was emitted into the site's own sitemap for a while, so it is in the wild.
# The canonical page is lowercase; send the mis-cased form there permanently.
[[redirects]]
  from = "/Copyright/"
  to = "/copyright/"
  status = 301
  force = true

[[redirects]]
  from = "http://jcrt.org/oai"
  to = "https://jcrt.org/oai"
  status = 302
  force = true

[[redirects]]
  from = "http://jcrt.org/sitemaps/oai_dc.xml"
  to = "https://jcrt.org/sitemaps/oai_dc.xml"
  status = 302
  force = true

[[redirects]]
  from = "http://jcrt.org/sitemap/oai_dc.xml"
  to = "https://jcrt.org/sitemap/oai_dc.xml"
  status = 302
  force = true

# .cache holds _data/tagIndex.js's tag-index-cache.json. (.npm-cache used to be listed too; it
# duplicated Netlify's own node_modules/npm cache and only made restore/save slower.)
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".cache"]

# Purges the Cloudflare edge cache once the production deploy is live. Needs
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID; skips quietly without them, and skips
# deploy previews and branch deploys. See jcrt-meta/docs/cloudflare-cache.md.
[[plugins]]
  package = "./plugins/cloudflare-purge"

# Announces new page URLs to IndexNow after the deploy is live and the edge is purged (onSuccess
# handlers run in this order). Needs INDEXNOW_KEY (above); skips quietly without it. It keeps
# its own watermark via utils.cache, so it does not depend on netlify-plugin-cache.
[[plugins]]
  package = "./plugins/indexnow"

[[edge_functions]]
  function = "allow-indexing-bots"
  path = "/*"
  # Static assets never need this function. Without the exclusion these three /*
  # functions all execute on every CSS, JS, image and Pagefind request, stacking three
  # edge invocations in front of files that could otherwise be served straight from CDN.
  excludedPath = ["/css/*", "/js/*", "/fonts/*", "/badges/*", "/pagefind/*", "/images/*", "/favicon.ico"]

[[edge_functions]]
  function = "oai-pmh"
  path = "/sitemaps/oai_dc.xml"

[[edge_functions]]
  function = "oai-pmh"
  path = "/sitemap/oai_dc.xml"

[[edge_functions]]
  function = "oai-pmh"
  path = "/oai"

[[edge_functions]]
  function = "oai-pmh"
  path = "/oai/*"

[[edge_functions]]
  function = "query-canonical-redirects"
  path = "/*"
  # Static assets never need this function. Without the exclusion these three /*
  # functions all execute on every CSS, JS, image and Pagefind request, stacking three
  # edge invocations in front of files that could otherwise be served straight from CDN.
  excludedPath = ["/css/*", "/js/*", "/fonts/*", "/badges/*", "/pagefind/*", "/images/*", "/favicon.ico"]

[[edge_functions]]
  function = "archive-legacy-redirects"
  path = "/archives/*"

[[edge_functions]]
  function = "asset-canonical-redirects"
  path = "/citations/*"

[[edge_functions]]
  function = "asset-canonical-redirects"
  path = "/images"

[[edge_functions]]
  function = "asset-canonical-redirects"
  path = "/images/*"

[[edge_functions]]
  function = "asset-canonical-redirects"
  path = "/docs/*"

[[edge_functions]]
  function = "markdown-for-agents"
  path = "/*"
  # Static assets never need this function. Without the exclusion these three /*
  # functions all execute on every CSS, JS, image and Pagefind request, stacking three
  # edge invocations in front of files that could otherwise be served straight from CDN.
  excludedPath = ["/css/*", "/js/*", "/fonts/*", "/badges/*", "/pagefind/*", "/images/*", "/favicon.ico"]

# Cache-Control and CORS for static assets live in `public/_headers` (single source of
# truth). Defining them here too produced two conflicting rules for /css/*, /js/* and
# /images/* with undefined precedence.
